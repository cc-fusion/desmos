<!doctype html>
<html>

<head>
  <title>Soft body simulation</title>
  <style>
    canvas {
      aspect-ratio: 1/1;
      max-width: 100%;
      max-height: 100%;
      width: 100%;
      background-color: #ffffff;
    }
  </style>
</head>

<body>
  <canvas id="canvas"></canvas>
  <script>
    let deployment = "dev"
    let internalSize = 2000
    canvas.width = internalSize
    canvas.height = internalSize
    let ctx = canvas.getContext("2d")

    // Constants

    const BOUNCINESS = 1
    const GRAVITY = 0.3
    const STIFFNESS = 0.5
    const WALLFRICTION = 100
    const AIRFRICTION = 1
    const DAMPING = 0.1
    const halfPi = Math.PI/2

    // Helpers
    function getCenter(pts) {
      let center = new Vector2(0,0)
      
      for (let p of pts) {
        center.add(p)
      }
      return center.multiplyScalar(1/pts.length)
    }
    function distance(a, b, c, d) {
      if (typeof a == "object") {
        return distance(a.x, a.y, b.x, b.y)
      } else {
        return Math.sqrt((a-c)**2+(b-d)**2)
      }
    }
    function closestVertices(pt, polygon) {
      let minLength = 1/0
      let minIdx = -1
      for (let i = 0; i < polygon.length; i++) {
        let idx1 = i
        let idx2 = (i+1)%polygon.length
        let currLength = distance(pt, polygon[idx1]) + distance(pt, polygon[idx2])
        if (currLength < minLength) {
          minLength = currLength
          minIdx = i
        }
      }
      return [
        polygon[minIdx],
        polygon[(minIdx+1)%polygon.length]
      ]
    }
    function closestPointOnSegment(pt, pt1, pt2) {
      // todo: convert to lin. alg
      // Find y=mx+b
      // calculate slope
      let m1 = (pt2.y - pt1.y)/(pt2.x - pt1.x)
      let b1 = pt1.y - m1 * pt1.x

      // Find the y=mx+b for the perpendicular segment, then find the intersection
      // perpendicular slope must be m'=-1/m
      let m2 = -1/m1
      let b2 = pt.y - m2 * pt.x
      
      // Find point of intersection
      let x = (b2-b1)/(m1-m2)
      let y = m1*x+b1

      return new Vector2(x,y)
    }
    function clampMod(val, min, max) {
      while (val < min) val += max-min
      while (val > max) val -= max-min
      return val
    }
    function clamp(val, min, max) {
      return Math.min(Math.max(min, val), max)
    }

    // Springs
    function computeSpringForce(pos, target, stiffness) {
      // F = -kx
      return pos.copy().subtract(target).multiplyScalar(-stiffness) // -4 lines with vectors!
    }
    function computeSpringDamping(vel, relativeVel, damping) {
      return vel.copy().subtract(relativeVel).multiplyScalar(damping)
    }

    // Trig
    function rotate(pos, theta, center={x:0,y:0}) {
      let cos = Math.cos(theta)
      let sin = Math.sin(theta)
      return new Vector2(
        (pos.x-center.x)*cos - (pos.y-center.y)*sin + center.x,
        (pos.x-center.x)*sin + (pos.y-center.y)*cos + center.y
      )
    }
    function calculateAngle(pos1, pos2) {
      let distY = pos2.y - pos1.y
      let distX = pos2.x - pos1.x
      return Math.atan2(distY, distX)
    }
    function calculateNormAngle(pos1, pos2) {
      return calculateAngle(norm(pos1), norm(pos2))
    }

    // Raycasting + point-in-polygon
    function raycastHoriz0(x1, y1, x2, y2) {
      // check if line segment (x1, y1, x2, y2) intersects y=0 for x>=0
      if ((y1 > 0) === (y2 > 0)) return false // y1 and y2 must not be on the same side of the y=0 axis
      
      let intersection = x1 - y1 * (x2 - x1)/(y2 - y1) // this also works for edge cases where y1 or y2 is on one of the points
      return intersection >= 0
    }
    function raycastHoriz(a, b, x1, y1, x2, y2) {
      return raycastHoriz0(x1-a, y1-b, x2-a, y2-b)
    }
    function ptInPolygon(pt, polygon) {
      // odd intersections: true, even: false
      let intersections = 0
      for (let i = 0; i < polygon.length; i++) {
        let idx1 = i
        let idx2 = (i+1)%polygon.length
        intersections += raycastHoriz(pt.x, pt.y, polygon[idx1].x, polygon[idx1].y, polygon[idx2].x, polygon[idx2].y)
      }
      return intersections % 2 == 1
    }

    class Vector2 {
      constructor(x, y) {this.x = x;this.y = y}
      add(otherVec) {this.x += otherVec.x;this.y += otherVec.y;return this}
      subtract(otherVec) {this.x -= otherVec.x;this.y -= otherVec.y;return this}
      multiplyScalar(num) {this.x *= num;this.y *= num;return this}
      dot(other) {return this.x * other.x + this.y * other.y;return this}
      cross(other) {return this.x * other.y + this.y * other.x;return this}
      norm() {
        let dist = this.magnitude
        if (dist == 0) throw "Cannot normalize zero vector."
        this.x /= dist;this.y /= dist
        return this
      }
      get magnitude() {
        return Math.sqrt(this.x**2 + this.y**2)
      }
      get direction() {
        return Math.atan2(this.y, this.x)
      }
      rotateBy(theta, center={x:0,y:0}) {
        let cos = Math.cos(theta)
        let sin = Math.sin(theta)
        let newX = (this.x-center.x)*cos - (this.y-center.y)*sin + center.x
        this.y = (this.x-center.x)*sin + (this.y-center.y)*cos + center.y
        this.x = newX
        return this
      }
      rotateTo(theta, center={x:0,y:0}) {
        return this.rotateBy(theta - this.direction, center)
      }
      copy() {return new Vector2(this.x, this.y)}
    }

    class SoftBody {
      static ID = 1
      constructor(pos, velX=0, velY=0) {
        this.UUID = SoftBody.ID
        SoftBody.ID++
        this.initPos = []
        for (let p of pos) {
          this.initPos.push(new Vector2(p.x, p.y))
        }
        this.initCenter = getCenter(pos)
        this.prevCenter = this.initCenter
        
        this.pos = pos
        this.vel = []
        for (let p of pos) {
          this.vel.push(new Vector2(velX,velY))
        }
        this.DEBUG_targetPos=[]
      }
      updateVelocity() {
        for (let i = 0; i < this.pos.length; i++) {
          let pos = this.pos[i]
          let vel = this.vel[i]
          this.vel[i].y += GRAVITY
          let updated = pos.copy().add(vel)
          if (updated.x < 0) {
            pos.x = 0
            vel.x *= -BOUNCINESS
            vel.y /= WALLFRICTION
          } else if (updated.x > canvas.width) {
            pos.x = canvas.width
            vel.x *= -BOUNCINESS
            vel.y /= WALLFRICTION
          } else {
            pos.x = updated.x
          }
          if (updated.y < 0) {
            pos.y = 0
            vel.y *= -BOUNCINESS
            vel.x /= WALLFRICTION
          } else if (updated.y > canvas.height) {
            pos.y = canvas.height
            vel.y *= -BOUNCINESS
            vel.x /= WALLFRICTION
          } else {
            pos.y = updated.y
          }
          
          vel.multiplyScalar(1/AIRFRICTION)
        }
      }
      updateShape() {
        let center = getCenter(this.pos)

        // START magic thing that actually works and doesn't explode
        let a1 = 0
        let a2 = 0
        for (let i = 0; i < this.pos.length; i++) {
          let px = this.pos[i].x - center.x
          let py = this.pos[i].y - center.y
          let qx = this.initPos[i].x - this.initCenter.x
          let qy = this.initPos[i].y - this.initCenter.y

          a1 += py * qx - px * qy
          a2 += px * qx + py * qy // hey, this looks like one of the vector multiplication things! (TODO: change to vector)
        }
        
        let optimalRotation = Math.atan2(a1, a2)
        // END magic thing that actually works and doesn't explode

        let centerVel = center.copy().subtract(this.prevCenter)
        for (let i = 0; i < this.pos.length; i++) {
          let pos = this.pos[i]
          let vel = this.vel[i]
          let initPos = this.initPos[i]
          let targetPos = initPos.copy().rotateBy(optimalRotation, this.initCenter).add(center).subtract(this.initCenter) // TODO: isn't this just centerVel?

          this.DEBUG_targetPos[i] = targetPos
          // create a spring between the target position and current point
          let springForce = computeSpringForce(pos, targetPos, STIFFNESS)
          let springDamping = computeSpringDamping(vel, centerVel, DAMPING)
          vel.add(springForce).subtract(springDamping)
        }
        this.prevCenter = center
      }
      updateIntersection() {
        for (let otherBody of bodies) {
          if (otherBody.UUID == this.UUID) continue
          for (let i = 0; i < this.pos.length; i++) {
            let pos = this.pos[i]

            if (ptInPolygon(pos, otherBody.pos)) {
              let vertices = closestVertices(pos, otherBody.pos)
              let closestPoint = closestPointOnSegment(pos, vertices[0], vertices[1])
              let distanceRatio = distance(vertices[0],closestPoint)/distance(vertices[0], vertices[1])
              let penetrationDepth = distance(closestPoint, pos)
              let pointToSegmentForceVec = pos.copy().subtract(closestPoint).norm().multiplyScalar(penetrationDepth)
              this.pos[i].subtract(pointToSegmentForceVec)
              vertices[0].add(pointToSegmentForceVec.copy().multiplyScalar(1-distanceRatio))
              vertices[1].add(pointToSegmentForceVec.copy().multiplyScalar(distanceRatio))
            }
          }
        }
      }
      update() {
        this.updateVelocity()
        this.updateShape()
        this.updateIntersection()
      }
    }
    function update() {
      for (let body of bodies) {
        body.update()
      }
    }
    let debug = 1
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height)
      for (let body of bodies) {
        ctx.strokeStyle = "#000"
        ctx.fillStyle = "#f00"
        ctx.lineWidth = 5

        ctx.beginPath()
        ctx.moveTo(body.pos[0].x, body.pos[0].y)
        body.pos.forEach(p => ctx.lineTo(p.x, p.y))
        ctx.lineTo(body.pos[0].x, body.pos[0].y)
        ctx.stroke()

        for (let i = 0; i < body.pos.length; i++) {
          // spring from target pos to actual pos
          ctx.strokeStyle = "#99f"
          ctx.lineWidth=3
          ctx.beginPath()
          ctx.moveTo(body.DEBUG_targetPos[i].x, body.DEBUG_targetPos[i].y)
          ctx.lineTo(body.pos[i].x, body.pos[i].y)
          ctx.stroke()

          // debug pts
          ctx.fillStyle = "#99f"
          ctx.beginPath()
          ctx.arc(body.DEBUG_targetPos[i].x, body.DEBUG_targetPos[i].y, 10, 0, 6.29)
          ctx.fill()

          // actual pts
          ctx.fillStyle = "#000"
          ctx.beginPath()
          ctx.arc(body.pos[i].x, body.pos[i].y, 10, 0, 6.29)
          ctx.fill()
        }
      }
    }
    function circle(x,y, radius, numpts) {
      let points = []
      for (let i = 0; i < numpts; i++) {
        let theta = i/numpts*Math.PI*2
        points.push(new Vector2(
          x+Math.cos(theta)*radius,
          y+Math.sin(theta)*radius
        ))
      }
      return points
    }
    let bodies = [
      new SoftBody(circle(500,500,400,80),5,0.2),
      new SoftBody(circle(1500,1500,400,80),-5,0),
    ]
    
    
    let lastDraw = 0
    let frameRate = 60
    function animate() {
      if (Date.now() - lastDraw < 1000/frameRate) {
        requestAnimationFrame(animate)
        return
      }
      update()
      render()
      lastDraw = Date.now()
      requestAnimationFrame(animate)
    }
    requestAnimationFrame(animate)
  </script>
</body>

</html>
