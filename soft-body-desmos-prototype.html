<!doctype html>
<html>

<head>
  <title>Round soft body simulation</title>
  <style>
    canvas {
      aspect-ratio: 1/1;
      max-width: 100%;
      max-height: 100%;
      width: 100%;
      background-color: #ffffff;
    }
  </style>
</head>

<body>
  <canvas id="canvas"></canvas>
  <script>
    let deployment = "dev"
    let internalSize = 2000
    canvas.width = internalSize
    canvas.height = internalSize
    let ctx = canvas.getContext("2d")
    function calculateAvgAngle(pos, center) {
      let totalCos = 0
      let totalSin = 0
      for (let i = 0; i < pos.length; i++) {
        let currAngle = Math.atan2(center.y - pos[i].y, center.x - pos[i].x)
        if (isNaN(currAngle)) throw "atan2 is undefined"
        totalCos += Math.cos(currAngle)
        totalSin += Math.sin(currAngle)
      }
      return Math.atan2(totalSin, totalCos)
    }
    function getCenter(pts) {
      let centerX = 0
      let centerY = 0
      
      for (let p of pts) {
        centerX += p.x
        centerY += p.y
      }
      return {x: centerX/pts.length, y: centerY/pts.length}
    }
    function computeSpring(pos, target, stiffness) {
      // F = -kx
      let displacementX = pos.x - target.x
      let displacementY = pos.y - target.y
      let forceX = -stiffness * displacementX
      let forceY = -stiffness * displacementY
      pos.x += forceX
      pos.y += forceY
      return pos
    }
    class SoftBody {
      constructor(pos) {
        this.initPos = pos
        if (deployment == "dev") {
          this.initPos = pos.map(p => Object.freeze({ ...p}))
          Object.freeze(this.initPos)
        }
        this.initCenter = getCenter(pos)

        this.initAvgAngle = calculateAvgAngle(pos,this.initCenter)
        
        this.pos = pos
        this.vel = []
        for (let p of pos) {
          this.vel.push({x:0,y:0})
        }
        this.DEBUG_targetPos=[]
      }
      update() {
        // 1. Update velocity
        for (let i = 0; i < this.pos.length; i++) {
          this.pos[i].x += this.vel[i].x
          this.pos[i].y += this.vel[i].y
          this.vel[i].x /= 1.01
          this.vel[i].y /= 1.01
        }
        let center = getCenter(this.pos)

        let offset = {
          x: center.x - this.initCenter.x,
          y: center.y - this.initCenter.x,
        }
        let avgAngle = calculateAvgAngle(this.pos, this.initCenter)
        let optimalRotation = 0//this.initAvgAngle - avgAngle

        for (let i = 0; i < this.pos.length; i++) {
          // translate
          let targetPos = {
            x: this.initPos[i].x + offset.x,
            y: this.initPos[i].y + offset.y,
          }
          // rotate
          targetPos.x = targetPos.x*Math.cos(optimalRotation) - targetPos.y*Math.sin(optimalRotation)
          targetPos.y = targetPos.x*Math.sin(optimalRotation) + targetPos.y*Math.cos(optimalRotation)
          this.DEBUG_targetPos[i]= targetPos
          // create a spring between the target position and current point
          this.pos[i] = computeSpring(this.pos[i], targetPos, 0.1)
        }
      }
    }
    function distance(x1, y1, x2, y2) {
      if (typeof x1 == "object") {
        return Math.sqrt((x1.x-y1.x)**2+(x1.y-y1.y)**2)
      }
      return Math.sqrt((x1-x2)**2+(y1-y2)**2)
    }
    const GRAVITY = 0
    function update() {
      for (let body of bodies) {
        body.update()
      }
    }
    let debug = 1
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height)
      for (let body of bodies) {
        ctx.strokeStyle = "#000"
        ctx.fillStyle = "#f00"
        ctx.lineWidth = 5

        ctx.beginPath()
        ctx.moveTo(body.pos[0].x, body.pos[0].y)
        body.pos.forEach(p => ctx.lineTo(p.x, p.y))
        ctx.lineTo(body.pos[0].x, body.pos[0].y)
        ctx.stroke()

        for (let i = 0; i < body.pos.length; i++) {
          ctx.fillStyle = "#f00"
          ctx.beginPath()
          ctx.arc(body.pos[i].x, body.pos[i].y, 10, 0, 6.29)
          ctx.fill()

          ctx.fillStyle = "#00f"
          ctx.lineWidth=3
          ctx.strokeStyle = "#00f"
          ctx.beginPath()
          ctx.moveTo(body.DEBUG_targetPos[i].x, body.DEBUG_targetPos[i].y)
          ctx.lineTo(body.pos[i].x, body.pos[i].y)
          ctx.stroke()
          ctx.beginPath()
          ctx.arc(body.DEBUG_targetPos[i].x, body.DEBUG_targetPos[i].y, 10, 0, 6.29)
          ctx.fill()
        }
      }
    }
    let bodies = [
      new SoftBody([
        {x: 1000-150, y: 1000-150},
        {x: 1000-150, y: 1000+150},
        {x: 1000+150, y: 1000+150},
        {x: 1000+150, y: 1000-150},
      ])
    ]
    bodies[0].vel[0].x=5
    bodies[0].vel[0].y=5
    
    
    let lastDraw = 0
    let frameRate = 60
    function animate() {
      if (Date.now() - lastDraw < 1000/frameRate) {
        requestAnimationFrame(animate)
        return
      }
      update()
      render()
      lastDraw = Date.now()
      requestAnimationFrame(animate)
    }
    requestAnimationFrame(animate)
  </script>
</body>

</html>
