  <style>
    canvas {
      aspect-ratio: 1/1;
      max-width: 100%;
      max-height: 100%;
      width: 100%;
      background-color: #ffffff;
    }
  </style>
</head>

<body>
  <canvas id="canvas"></canvas>
  <script>
    let deployment = "dev"
    let internalSize = 2000
    canvas.width = internalSize
    canvas.height = internalSize
    let ctx = canvas.getContext("2d")
    function calculateAvgAngle(pos) {
      let totalCos = 0
      let totalSin = 0
      for (let p of pos) {
        let currAngle = Math.atan2(this.initCenterY - p.y, this.initCenterX - p.x)
        totalCos += Math.cos(currAngle)
        totalSin += Math.sin(currAngle)
      }
      return Math.atan2(totalSin, totalCos)
    }
    function getCenter(pts) {
      let centerX = 0
      let centerY = 0
      
      for (let p of pts) {
        centerX += p.x
        centerY += p.y
      }
      return {x: centerX/pts.length, y: centerY/pts.length}
    }
    function computeSpring(pos, target, stiffness) {
      // F = -kx
      let displacementX = pos.x - target.x
      let displacementY = pos.y - target.x
      let forceX = -stiffness * displacementX
      let forceY = -stiffness * displacementY
      pos.x += forceX
      pos.y += forceY
      return pos
    }
    class SoftBody {
      constructor(pos) {
        this.initPos = pos
        
        let center = getCenter(pos)
        this.initCenterX = center.x
        this.initCenterY = center.y

        this.initAvgAngle = calculateAvgAngle(pos)
        
        if (deployment == "dev") this.initPos = Object.freeze(pos)
        this.pos = pos
        this.vel = []
        for (let p of pos) {
          this.vel.push({x:0,y:0})
        }
      }
      update() {
        // 1. Update velocity
        
        for (let i = 0; i < this.pos.length; i++) {
          this.pos.x[i] += this.vel.x[i]
          this.pos.y[i] += this.vel.y[i]
          this.vel.x[i] /= 1.01
          this.vel.y[i] /= 1.01
        }
        let center = getCenter(this.pos)

        let offset = {
          x: center.x - this.initCenterX,
          y: center.y - this.initCenterY,
        }

        let avgAngle = calculateAvgAngle(pos)
        let optimalRotation = this.initAvgAngle - avgAngle

        for (let i = 0; i < this.pos.length; i++) {
          // translate
          let targetPos = {
            x: this.initialPos[i].x + offsetX,
            y: this.initialPos[i].y + offsetY,
          }
          // rotate
          targetPos.x = targetPos.x*Math.cos(optimalRotation) - targetPos.y*Math.sin(optimalRotation)
          targetPos.y = targetPos.x*Math.sin(optimalRotation) + targetPos.y*Math.cos(optimalRotation)
          if (deployment == "dev") this.DEBUG.targetPos = targetPos
          // create a spring between the target position and current point
          computeSpring(this.pos[i], targetPos, 0.0001)
        }
      }
      getCenter() {
        let avgX = 0
        let avgY = 0
        for (let pt of this.pos) {
          avgX += pt
          avgY += pt
        }
        return {
          x: avgX / this.pts.length,
          y: avgY / this.pts.length
        }
      }
    }
    function distance(x1, y1, x2, y2) {
      if (typeof x1 == "object") {
        return Math.sqrt((x1.x-y1.x)**2+(x1.y-y1.y)**2)
      }
      return Math.sqrt((x1-x2)**2+(y1-y2)**2)
    }

    }
    let debug = 1
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height)
      
    }
    let bodies = [
      new SoftBody([
        {x: 1000-50, y: 1000-50},
        {x: 1000-50, y: 1000+50},
        {x: 1000+50, y: 1000+50},
        {x: 1000+50, y: 1000-50},
      ])
    ]
    
    bodies[0].pts[8].velX -= 100
    let lastDraw = 0
    let frameRate = 60
    function animate() {
      if (Date.now() - lastDraw < 1000/frameRate) {
        requestAnimationFrame(animate)
        return
      }
      update()
      render()
      lastDraw = Date.now()
      requestAnimationFrame(animate)
    }
    requestAnimationFrame(animate)
  </script>
</body>

</html>
