<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Document</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 2rem;
    }
  </style>
</head>

<body>
  <button id="train">Train</button><br><br>
  <input id="iterationsInput" value="1"><button id="trainAsync">Train (async)</button><br><br>
  <input id="testString"><button id="runModel">Run model</button><br><br>
  
  <pre id="log"></pre>
  <script>
    function log() {
      document.getElementById("log").innerText = [...arguments].join("\t") + "\n" + document.getElementById("log").innerText
    }
    addEventListener("error", (e) => {
      log(e.message)
    })
  </script>
  <script>
    let vocabRaw
    let trainingDataRaw
    
    let CONFIG = {
      embedding_dim: 8,
      window_size: 3,
      num_filters: 16,
      learning_rate: 0.05,
    }

    let vocabMap = {}
    let vocabLength
    let trainingData = []
    let model

    function sigmoid(x) {
      return 1 / (1 + Math.exp(-x))
    }

    async function fetchData() {
      try {
        vocabRaw = await (await fetch("https://raw.githubusercontent.com/cc-fusion/desmos/refs/heads/main/neural-network/sentiment-analysis/vocab-1000.json")).json() // ["word", "word", ....]
        trainingDataRaw = await (await fetch("https://raw.githubusercontent.com/cc-fusion/desmos/refs/heads/main/neural-network/sentiment-analysis/filtered_margin_0.99_vocab.json")).json() // [{"text": text, "label": positive/negative/neutral/other}]
        start()
      } catch(e) {
        log(e)
      }
    }

    class Model {
      constructor() {
        this.embeddings = []
        this.filters = []
        this.output = {}
        this.init()
      }
      init() {
        // embeddings
        for (let word in vocabMap) {
          let randomEmbedding = []
          if (word == "<PAD>") {
            for (let j = 0; j < CONFIG.embedding_dim; j++) randomEmbedding.push(0)
          } else {
            for (let j = 0; j < CONFIG.embedding_dim; j++) randomEmbedding.push((Math.random()-0.5)*0.1)
          }
          this.embeddings.push(randomEmbedding)
        }

        // filters
        for (let i = 0; i < CONFIG.num_filters; i++) {
          let weights = []
          for (let j = 0; j < CONFIG.window_size; j++) {
            weights.push([])
            for (let k = 0; k < CONFIG.embedding_dim; k++) {
              weights[j].push((Math.random()-0.5) * 0.1)
            }
          }
          this.filters.push({
            weights: weights,
            bias: 0,
          })
        }

        // output weights
        this.output.weights = []
        for (let i = 0; i < CONFIG.num_filters; i++) {
          this.output.weights.push((Math.random()-0.5) * 0.1)
        }
        this.output.bias = 0
      }
      tokenize(string) {
        let split = string.split(" ")
        let result = []
        for (let word of split) {
          if (!(word in vocabMap)) throw "ERROR: Word \"" + word + "\" not in vocab"
          let wordID = vocabMap[word]
          result.push(this.embeddings[wordID])
        }
        while (result.length < CONFIG.window_size) result.push(this.embeddings[vocabMap["<PAD>"]])
        return result
      }
      runFilter(filter, input) {
        let weights = filter.weights
        let sum = 0
        for (let i = 0; i < weights.length; i++) {
          for (let j = 0; j < weights[i].length; j++) {
            sum += input[i][j] * weights[i][j]
          }
        }
        return sum + filter.bias
      }
      forwards(input) {
        let tokenized
        if (typeof input == "string") {
          tokenized = this.tokenize(input)
        } else {
          tokenized = input
        }
        
        // run filters
        let filtered = []
        for (let filter of this.filters) {
          let max = -1/0
          for (let start = 0; start <= tokenized.length - CONFIG.window_size; start++) {
            max = Math.max(max, this.runFilter(filter, tokenized.slice(start, start + CONFIG.window_size)))
          }
          filtered.push(max)
        }

        let result = 0
        for (let i = 0; i < filtered.length; i++) {
          result += this.output.weights[i] * filtered[i]
        }
        return sigmoid(result + this.output.bias)
      }
      isPadding(token) {return token.every(item => item === 0)}
      train(input, expected) {
        let tokenized
        if (typeof input == "string") {
          tokenized = this.tokenize(input)
        } else {
          tokenized = input
        }
        
        // forwards pass

        // run filters
        let filtered = []
        let filteredIndices = []
        for (let filter of this.filters) {
          let max = -1/0
          let maxIdx = 0
          for (let start = 0; start <= tokenized.length - CONFIG.window_size; start++) {
            let value = this.runFilter(filter, tokenized.slice(start, start + CONFIG.window_size))
            if (value > max) {
              max = value
              maxIdx = start
            }
          }
          filtered.push(max)
          filteredIndices.push(maxIdx)
        }

        let result = 0
        for (let i = 0; i < filtered.length; i++) {
          result += this.output.weights[i] * filtered[i]
        }
        let originalOutputWeights = [...this.output.weights]
        
        let prediction = sigmoid(result + this.output.bias)
        
        // backwards pass

        let error = prediction - expected

        for (let i = 0; i < CONFIG.num_filters; i++) {
          this.output.weights[i] -= CONFIG.learning_rate * error * filtered[i]
        }
        this.output.bias -= CONFIG.learning_rate * error

        for (let f = 0; f < CONFIG.num_filters; f++) {
          let currentFilter = this.filters[f]
          let activeWindowIdx = filteredIndices[f]
          let filterError = error * originalOutputWeights[f]
          for (let i = 0; i < CONFIG.window_size; i++) {
            for (let j = 0; j < CONFIG.embedding_dim; j++) {
              let wordEmbedding = tokenized[activeWindowIdx + i]
              let tempFilterWeight = currentFilter.weights[i][j]

              currentFilter.weights[i][j] -= CONFIG.learning_rate * filterError * wordEmbedding[j]
              if (!this.isPadding(wordEmbedding)) wordEmbedding[j] -= CONFIG.learning_rate * filterError * tempFilterWeight 
            }
          }
          currentFilter.bias -= CONFIG.learning_rate * filterError
        }
      }
    }

    function initData() {
      vocabRaw.push("<PAD>")
      vocabLength = vocabRaw.length
      for (let i = 0; i < vocabLength; i++) {
        vocabMap[vocabRaw[i]] = i
      }

      trainingData = []
      for (let data of trainingDataRaw) {
        if (data.label == "positive" || data.label == "negative") {
          trainingData.push({
            "input": data.text,
            "expected": data.label == "positive" ? 1 : 0
          })
        }
      }
    }

    function start() {
      initData()
      model = new Model()
    }
    function train() {
      for (let data of trainingData) {
        model.train(data.input, data.expected)
      }
    }
    function asyncTrain(iterations, callback) {
      return new Promise((res) => {
        let i = 0
        let interval = setInterval(() => {
          callback(i, false)
          for (let x = 0; x < iterations; x++) {
            if (i >= trainingData.length) {
              res()
              clearInterval(interval)
              callback(i, true)
              return
            }
            let data = trainingData[i]
            model.train(data.input, data.expected)
            i++
          }
        })
      })
    }
    
    fetchData()

    document.getElementById("train").addEventListener("click", train)
    document.getElementById("trainAsync").addEventListener("click", () => {
      asyncTrain(parseInt(document.getElementById("iterationsInput").value), (i, done) => {
        if (done) {
          log("Completed training pass")
        } else {
          log(`Training in progress: ${i}/${trainingData.length} (${Math.floor(i/trainingData.length*100*10)/10}% done)`)
        }
      })
    })
    document.getElementById("runModel").addEventListener("click", (e) => {
      log(model.forwards(document.getElementById("testString").value))
    })
  </script>
</body>

</html>
