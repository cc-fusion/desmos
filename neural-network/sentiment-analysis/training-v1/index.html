<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Document</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 2rem;
    }
  </style>
</head>

<body>
  <pre id="log"></pre>
  <script>
    function log() {
      document.getElementById("log").innerText += [...arguments].join("\t")
    }
    addEventListener("error", (e) => {
      log(e.message)
    })
  </script>
  <script>
    let vocabRaw
    let trainingDataRaw
    
    let CONFIG = {
      embedding_dim: 8,
      window_size: 3,
      num_filters: 16,
    }

    let vocabMap = {}
    let vocabLength
    let trainingData = []
    let model

    async function fetchData() {
      try {
        vocabRaw = await (await fetch("https://raw.githubusercontent.com/cc-fusion/desmos/refs/heads/main/neural-network/sentiment-analysis/vocab-1000.json")).json() // ["word", "word", ....]
        trainingDataRaw = await (await fetch("https://raw.githubusercontent.com/cc-fusion/desmos/refs/heads/main/neural-network/sentiment-analysis/filtered_margin_0.99_vocab.json")).json() // [{"text": text, "label": positive/negative/neutral/other}]
        start()
      } catch(e) {
        log(e)
      }
    }

    class Model {
      constructor() {
        this.embeddings = []
        this.filters = []
        this.output = {}
        this.init()
      }
      init() {
        // embeddings
        for (let word in vocabMap) {
          let randomEmbedding = []
          if (word == "<PAD>") {
            for (let j = 0; j < CONFIG.embedding_dim; j++) randomEmbedding.push(0)
          } else {
            for (let j = 0; j < CONFIG.embedding_dim; j++) randomEmbedding.push((Math.random()-0.5)*0.1)
          }
          this.embeddings.push(randomEmbedding)
        }

        // filters
        for (let i = 0; i < CONFIG.num_filters; i++) {
          let weights = []
          for (let j = 0; j < CONFIG.window_size; j++) {
            weights.push([])
            for (let k = 0; k < CONFIG.embedding_dim; k++) {
              weights[j].push((Math.random()-0.5) * 0.1)
            }
          }
          this.filters.push({
            weights: weights,
            bias: 0,
          })
        }

        // output weights
        this.output.weights = []
        for (let i = 0; i < CONFIG.num_filters; i++) {
          this.output.weights.push((Math.random()-0.5) * 0.1)
        }
        this.output.bias = 0
      }
      tokenize(string) {
        let split = string.split(" ")
        let result = []
        for (let word of split) {
          if (!(word in vocabMap)) throw "ERROR: Word \"" + word + "\" not in vocab"
          let wordID = vocabMap[word]
          result.push(this.embeddings[wordID])
        }
        while (result.length < CONFIG.window_size) result.push(this.embeddings[vocabMap["<PAD>"]])
        return result
      }
      runFilter(filter, input) {
        let weights = filter.weights
        let max = 0
        for (let i = 0; i < weights.length; i++) {
          for (let j = 0; j < weights[i].length; j++) {
            max = Math.max(max,input[i][j] * weights[i][j]) // todo: weighted average
          }
        }
        return max
      }
      forwards(string) {
        let tokenized = this.tokenize(string)
        
        // run filters
        for (let filter of this.filters) {
          for (let start = 0; start < tokenized.length - CONFIG.window_size; start++) {
            filter
          }
        }
      }
    }

    function initData() {
      vocabRaw.push("<PAD>")
      vocabLength = vocabRaw.length
      for (let i = 0; i < vocabLength; i++) {
        vocabMap[vocabRaw[i]] = i
      }

      trainingData = []
      for (let data of trainingDataRaw) {
        if (data.label == "positive" || data.label == "negative") {
          trainingData.push({
            "text": data.text.split(" ").map(word => vocabMap[word]),
            "label": data.label == "positive" ? 1 : 0
          })
        }
      }
    }

    function start() {
      initData()
      model = new Model()
      model.tokenize("")
    }
    fetchData()
  </script>
</body>

</html>
