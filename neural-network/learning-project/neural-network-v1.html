<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #bcf;
    }

    #canvas {
      width: 100vmin;
      height: 100vmin;
      
      aspect-ratio: 1 / 1;
      display: block;
      background-color: #ffffff;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    let canvas = document.getElementById("canvas")
    let renderSize = 2000
    canvas.width = renderSize
    canvas.height = renderSize
    let ctx = canvas.getContext("2d")

    class Neuron {
      constructor(weightsCount) {
        this.weights = []
        for (let i = 0; i < weightsCount || 0; i++) this.weights.push(Math.random()*2-1)
        this.bias = Math.random()*2-1
      }
      activate(inputs) {
        let sum = this.bias
        for (let i = 0; i < inputs.length; i++) {
          sum += inputs[i] * this.weights[i]
        }
        return Math.tanh(sum)
      }
      copy() {
        let neuron = new Neuron()
        neuron.weights = [...this.weights]
        neuron.bias = this.bias
        return neuron
      }
      mutate(rate, strength) {
        for (let i = 0; i < this.weights.length; i++) {
          if (Math.random() < rate) {
            this.weights[i] += (Math.random()*2-1)*strength
          }
        }
        if (Math.random() < rate) {
          this.bias += (Math.random()*2-1)*strength
        }
        return this
      }
    }

    class Layer {
      constructor(inputsCount, outputsCount) {
        this.neurons = []
        for (let i = 0; i < (outputsCount || 0); i++) {
          this.neurons.push(new Neuron(inputsCount || 0))
        }
      }
      forward(inputs) {
        let output = []
        for (let neuron of this.neurons) {
          output.push(neuron.activate(inputs))
        }
        return output
      }
      copy() {
        let layer = new Layer()
        for (let neuron of this.neurons) {
          layer.neurons.push(neuron.copy())
        }
        return layer
      }
      mutate(rate, strength) {
        for (let neuron of this.neurons) {
          neuron = neuron.mutate(rate, strength)
        }
        return this
      }
    }

    class NeuralNetwork {
      constructor(shape) {
        this.shape = shape || []
        this.layers = []
        for (let i = 0; i < this.shape.length-1; i++) {
          this.layers.push(new Layer(this.shape[i], this.shape[i+1]))
        }
      }
      predict(inputs) {
        let output = inputs
        for (let layer of this.layers) {
          output = layer.forward(output)
        }
        return output
      }
      copy() {
        let nn = new NeuralNetwork()
        nn.shape = [...this.shape]
        for (let layer of this.layers) {
          nn.layers.push(layer.copy())
        }
        return nn
      }
      mutate(rate, strength) {
        for (let layer of this.layers) {
          layer.mutate(rate, strength)
        }
        return this
      }
    }

    class Agent {
      constructor (pos) {
        this.pos = pos
        this.radius = 0.01
      }
      update() {
        this.pos.clamp(new Vector2(this.radius,this.radius),new Vector2(1-this.radius,1-this.radius))
      }
      hasReachedGoal() {
        return distance(this.pos, goal.pos) < this.radius+goal.radius
      }
    }
    function distance() {
      let arg1 = arguments[0]
      let arg2 = arguments[1]
      if (arg1 instanceof Vector2 && arg2 instanceof Vector2) {
        return arg1.copy().subtract(arg2).magnitude
      } else if (typeof arg1 === "object" && typeof arg2 === "object" && "x" in arg1 && "y" in arg1 && "x" in arg2 && "y" in arg2) {
        return Math.hypot(arg1.x-arg2.x, arg1.y-arg2.y)
      }
      let arg3 = arguments[2]
      let arg4 = arguments[3]
      if (typeof arg1 === "number" && typeof arg2 === "number" && typeof arg3 === "number" && typeof arg4 === "number") {
        return Math.hypot(arg1-arg3, arg2-arg4)
      }
      throw "Unknown input types to function `distance`"
    }
    class Vector2 {
      constructor(x,y) {this.x=x;this.y=y}
      add(other) {this.x+=other.x;this.y+=other.y;return this}
      subtract(other) {this.x-=other.x;this.y-=other.y;return this}
      multiplyScalar(i) {this.x*=i;this.y*=i;return this}
      get magnitude() {return Math.hypot(this.x, this.y)}
      norm() {this.x==0&&this.y==0?this:this.multiplyScalar(1/this.magnitude);return this}
      copy() {return new Vector2(this.x, this.y)}
      clamp(min,max) {this.x=Math.min(max.x,Math.max(min.x,this.x));this.y=Math.min(max.y,Math.max(min.y,this.y));return this}
    }
    function update() {
      ctx.clearRect(0,0,canvas.width,canvas.height)
      ctx.fillStyle = "#00ff00"
      ctx.globalAlpha = 0.9
      ctx.beginPath()
      ctx.arc(goal.pos.x*renderSize, goal.pos.y*renderSize, goal.radius*renderSize, 0, 6.29)
      ctx.fill()

      ctx.fillStyle = "#8290b3"
      ctx.globalAlpha = 0.6
      for (let agent of agents) {
        agent.update()
        ctx.beginPath()
        ctx.arc(agent.pos.x*renderSize, agent.pos.y*renderSize, agent.radius*renderSize, 0, 6.29)
        ctx.fill()
      }
    }
    let agents = [
      new Agent(new Vector2(0.05, 0.5))
    ]
    let goal = {
      pos: new Vector2(0.9, 0.5),
      radius: 0.05,
    }
    let time = 0
    function animate() {
      update()
      time++
      requestAnimationFrame(animate)
    }
    requestAnimationFrame(animate)
  </script>
</body>
</html>
